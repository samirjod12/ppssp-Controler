name: Android CI
on:
  push:
    paths: ['AndroidController/**', 'Protocol/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['AndroidController/**', 'Protocol/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AndroidController
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK (debug-signed, no secrets needed)
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: AndroidController/app/build/reports/tests
      - uses: actions/upload-artifact@v4
        with:
          name: PSPController-debug-apk
          path: AndroidController/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Android Release
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.0 or 1.0.0-rc1 (a "-" suffix makes it a pre-release)'
        required: true
        default: '1.0.0-rc1'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#android-v}"; else v="${{ inputs.version }}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "Bad version $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Require signing secrets
        run: |
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ] \
            || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore (outside the repo)
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed release APK
        working-directory: AndroidController
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease -PappVersionName=${{ steps.ver.outputs.version }} -PappVersionCode=${{ github.run_number }}
      - name: Verify signature and package
        run: |
          apk=$(ls AndroidController/app/build/outputs/apk/release/*.apk | head -1)
          case "$apk" in *unsigned*) echo "::error::APK is unsigned"; exit 1;; esac
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose "$apk"
          mkdir dist
          out="dist/PSPController-android-v${{ steps.ver.outputs.version }}.apk"
          cp "$apk" "$out"
          (cd dist && sha256sum "$(basename "$out")" > "$(basename "$out").sha256")
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-files
          path: dist/*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release-files
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          pre=""; case "$V" in *-*) pre="--prerelease";; esac
          gh release create "android-v$V" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PSP Controller (Android) v$V" $pre \
            --notes "PSP Controller APK (Android 8.0+). Not yet tested on real hardware. SHA-256 is in the .sha256 file."
